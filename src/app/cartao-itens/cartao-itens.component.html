<section>
    <div class="card">
        <div class="caixa-imagem">
          <img class="card-img-top" [src]="imagem" alt="imagem do produto">
        </div>
        <div class="card-body">
          <div class="card-title">{{nome}}</div>  
          <span class="card-text">{{descricao}}</span>
          
          <div class="caixa-botoes">
            <button 
              *ngIf="modo === 'carrinho'" 
              class="btn" 
              [class]="classeBotaoSecundario" 
              (click)="remover()">
              <mat-icon>remove_shopping_cart</mat-icon> Remover
            </button>
            
            <button 
              *ngIf="modo === 'catalogo'" 
              class="btn" 
              [class]="classeBotaoPrincipal" 
              (click)="adicionar()">
              Adicionar 
            </button>
          </div>
        </div>
    </div>
</section>
