<footer class="rodape">
  <div class="rodape__conteudo">
    <div class="rodape__marca">
      <img src="assets/logos/armazem-logo.png" width="52" height="51" alt="">
      <div>
        <strong>Armazém Geovanne</strong>
        <span>Faça seu pedido online e finalize pelo WhatsApp.</span>
      </div>
    </div>

    <nav class="rodape__links" aria-label="Links do rodapé">
      <a [href]="whatsappUrl" target="_blank" rel="noopener">
        <mat-icon aria-hidden="true">chat</mat-icon> Fale no WhatsApp
      </a>
    </nav>
  </div>

  <div class="rodape__legal">
    <span>© {{ ano }} Armazém Geovanne. Todos os direitos reservados.</span>
    @if (demo) {
      <span class="rodape__demo">Ambiente de demonstração · dados fictícios</span>
    }
  </div>
</footer>
