@if (uiService.loading$ | async) {
  <div class="overlay-fundo" role="alert" aria-busy="true">
    <div class="caixa-loading">
      <div class="spinner"></div>
      <p>Carregando...</p>
    </div>
  </div>
}

<div class="toast-area" aria-live="polite" role="status">
  @if (uiService.toast$ | async; as toast) {
    @if (toast.show) {
      <div class="toast-notificacao" [class.erro]="toast.tipo === 'erro'">
        <mat-icon aria-hidden="true">{{ toast.tipo === 'erro' ? 'error_outline' : 'check_circle_outline' }}</mat-icon>
        {{ toast.mensagem }}
      </div>
    }
  }
</div>
