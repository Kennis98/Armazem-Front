<div class="seletor" role="group" [attr.aria-label]="descricao">
  <button type="button" class="seletor__btn" (click)="diminuir()" [disabled]="valor <= 1" aria-label="Diminuir quantidade">−</button>
  <input #campo type="number" inputmode="numeric" class="seletor__input" min="1" [attr.max]="max" [value]="valor"
    (input)="aoDigitar(campo)" (blur)="aoSair(campo)" [attr.aria-label]="descricao">
  <button type="button" class="seletor__btn" (click)="aumentar()" [disabled]="max !== null && valor >= max" aria-label="Aumentar quantidade">+</button>
</div>
