<section>
  <div *ngFor="let produto of produtos">
    <app-cartao-itens
      [nome]="produto.nome"
      [descricao]="produto.descricaoCurta"
      [estoque]="produto.estoque.saldoVirtualTotal"
      [imagem]="produto.imagemURL"
      (adicionarAoCarrinho)="adicionarAoCarrinho(produto)">
    </app-cartao-itens>
  </div>
</section>
