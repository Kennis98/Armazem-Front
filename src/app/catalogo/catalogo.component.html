<section>
  <div *ngFor="let produto of produtos">
    <app-cartao-itens
      [nome]="produto.nome"
      [descricao]="produto.descricaoCurta"
      [estoque]="produto.estoque.saldoVirtualTotal"
      [imagem]="produto.imagemURL"
      [modo]="'catalogo'"
      (adicionarAoCarrinho)="adicionarAoCarrinho(produto, $event)"> </app-cartao-itens>
  </div>
</section>
